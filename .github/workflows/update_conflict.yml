name: Daily Conflict Risk Update

on:
  schedule:
    - cron: '0 6 * * *'    # Every day at 6 AM UTC
  workflow_dispatch:         # Manual trigger from GitHub Actions tab

jobs:
  update-conflict:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run conflict update
        run: python update_conflict.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/conflict.py backend/conflict_update_log.json
          git diff --staged --quiet || git commit -m "Auto-update conflict risk [$(date '+%Y-%m-%d')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
