name: Monthly Port Data Update

on:
  schedule:
    - cron: '0 5 1 * *'    # 1st of every month at 5 AM UTC
  workflow_dispatch:

jobs:
  update-ports:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Download latest NGA World Port Index
        run: python update_ports.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/UpdatedPub150.csv
          git diff --staged --quiet || git commit -m "Auto-update NGA port data [$(date '+%Y-%m')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
